<body>
<h1>Practice</h1>
<script>
    let numbers = [100, 200, 300, 400, 500, 600];
    const getArraySum = (numbers) => {
        let sum = 0;
        for (let i = 0; i < numbers.length; i++) {
            sum += numbers[i];
        }
        return sum;
    }
    const getArrayAverage = (numbers) => {
        return getArraySum(numbers) / numbers.length;
    }
    console.log(getArrayAverage(numbers));
    console.log(getArraySum(numbers));


</script>

</body>
