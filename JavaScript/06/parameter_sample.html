<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>関数の定義方法</title>
</head>
<body>
<h1>関数の定義方法</h1>
<script>
    const calculateCircleArea = () => {
        // 半径
        let radius = 10;
        // 円周率は3.14で計算
        let pi = 3.14;
        let area = pi * radius * radius;
        console.log(`半径${radius}の円の面積は${area}です。`);
    };

    calculateCircleArea();
</script>
</body>
</html>
