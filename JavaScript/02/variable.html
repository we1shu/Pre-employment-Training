<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
<h1>変数のサンプル</h1>
<script>
    // 変数aを宣言
    let a;
    // 変数 a に100を代入
    a = 100;
    // 変数 a の中身を出力
    console.log(a);
    // 一度保存した変数は何度でも利用できる
    console.log(a);
    // 変数を上書き
    a = 200;
    // 変数の中身が変わっている。
    console.log(a);
</script>
</body>
</html>
