<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>テンプレートリテラルの使い方</title>
</head>
<body>
<h1>テンプレートリテラルの使い方</h1>
<script>
    // 足し算と引き算
    let message = `合計金額は${100 + 200 + 300}円です`;
    console.log(message);

    // 文字列への埋め込み
    let name = '山田太郎';
    let greeting = `こんにちは、${name}さん`;
    console.log(greeting);
</script>
</body>
