<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>数値のサンプル</title>
</head>
<body>
<h1>数値のサンプル</h1>
<script>
    // 正の整数
    let a = 100;
    console.log(a);
    // 負の整数
    let b = -200;
    console.log(b);
    // 小数
    let c = 3.14;
    console.log(c);
</script>
</body>
</html>
