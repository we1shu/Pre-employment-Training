<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>文字列のサンプル</title>
</head>
<body>
<h1>文字列のサンプル</h1>
<script>
    // 文字列はクォーテーションで囲む
    let name = '山田太郎';
    console.log(name);
    // ダブルクォーテーションも利用できる
    let greeting = "おはようございます!";
    console.log(greeting);
    // 空文字列
    let empty = '';
    console.log(empty);
</script>
</body>
</html>
