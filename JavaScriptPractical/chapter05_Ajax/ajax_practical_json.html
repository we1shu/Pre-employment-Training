<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ajaxのサンプル</title>
</head>
<body>
<h1>ajaxのサンプル</h1>
1から<input type="number" id="number">までの合計

<p id="box">ここに受け取ったテキストが入ります。</p>
<script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
<script>
    $(function(){
        // 入力のたびに実行
        $('#number').on('input', () => {
            // ajaxでリクエストを送信
            $.ajax({
                url: 'https://sample-code.codecamp.jp/textbook/ajax_sample/get_sum_json.php',
                // GET送信する値を指定
                data: {
                    number: $('#number').val()
                },
                dataType: 'json'
            }).done((res) => {
                console.log(res);
                // リクエストが成功したときの処理
                $('#box').html(res.max + 'までの合計は' + res.sum);
            }).fail(() => {
                alert('エラーです');
            });
        });
    });
</script>
</body>
</html>
