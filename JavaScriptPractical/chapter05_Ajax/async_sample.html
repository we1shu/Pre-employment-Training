<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>同期処理と非同期処理</title>
</head>
<body>
<h1>同期処理と非同期処理</h1>
<div>
    <label>確認用: <input type="text"></label>
</div>
<button id="send">ajaxでリクエスト送信</button>
<p id="box">ここに受け取ったテキストが入ります。</p>
<script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
<script>
    // button#sendがクリックされた時に
    $('#send').on('click', () => {
        // ajaxでリクエストを送信
        $.ajax({
            // リクエストの送信先
            url: 'https://sample-code.codecamp.jp/textbook/ajax_sample/sleep5.php',
            async: true
        }).done((res) => {
            // リクエストが成功したときの処理
            $('#box').html(res);
        }).fail(() => {
            alert('エラーです');
        });
    });
</script>
</body>
</html>
