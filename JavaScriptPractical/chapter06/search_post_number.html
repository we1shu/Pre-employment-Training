<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <title>郵便番号検索のサンプル</title>
    <script src="https://yubinbango.github.io/yubinbango/yubinbango.js" charset="UTF-8"></script>
</head>

<body>
<form class="h-adr">
    <span class="p-country-name" style="display:none;">Japan</span>

    <p>
        <label>〒<input type="text" class="p-postal-code" size="8" maxlength="8"></label>
    </p>
    <p>
        <label>都道府県：<input type="text" class="p-region" size="80" /></label>
    </p>
    <p>
        <label>市町村区：<input type="text" class="p-locality" size="80" /></label>
    </p>
    <p>
        <label>町域：<input type="text" class="p-street-address" size="80" /></label>
    </p>
    <p>
        <label>以降の住所：<input type="text" class="p-extended-address" size="80" /></label>
    </p>
</form>
</body>

</html>
