<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <title>Web Storage API(session) のサンプル</title>
    <script src="https://code.jquery.com/jquery-3.5.0.min.js"
            integrity="sha256-xNzN2a4ltkB44Mc/Jz3pT4iU1cmeR0FkXs4pru/JxaQ=" crossorigin="anonymous"></script>
    <style>
        :root {
            --background-color: #fff;
            --font-color: #000;
        }

        :root[theme="dark"] {
            --background-color: #000;
            --font-color: #fff;
        }

        body,
        select {
            background-color: var(--background-color);
            color: var(--font-color);
        }
    </style>
</head>

<body>
<h1>Web Storage API(session) のサンプル</h1>
<label>現在のテーマ:
    <select id="theme">
        <option value="light">ライト</option>
        <option value="dark">ダーク</option>
    </select>
</label>

<script>
    $(function () {
        // テーマが変更された時の処理
        $('#theme').change(function () {
            let newTheme = $(this).val(); // 画面で選択されているテーマを取得
            $('html').attr('theme', newTheme); // テーマを変更
            sessionStorage.setItem('theme', newTheme); // テーマをストレージに保存
        });

        // ストレージに保存されているテーマを取得
        let savedTheme = sessionStorage.getItem('theme');
        if (savedTheme !== null) {
            // テーマを変更
            $('html').attr('theme', savedTheme);
            // 画面のテーマ選択を変更
            $('#theme').val(savedTheme);
        }
    });
</script>
</body>

</html>
