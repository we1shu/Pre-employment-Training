<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>実行タイミング</title>
    <script>
        //load means after dom is loaded, the function active
        window.addEventListener('load', () => {
            // DOM要素の取得
            let heading = document.getElementById('heading');
            // 要素内のテキストをアラートで表示
            alert(heading.innerHTML);
        });
    </script>
</head>
<body>
<h1 id="heading">実行タイミング</h1>
</body>
</html>
