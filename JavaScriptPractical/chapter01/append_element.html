<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>DOM 要素の生成と追加</title>
</head>
<body>
<h1 id="heading">DOM 要素の生成と追加</h1>
<div id="box">boxを</div>
<script>
    // p要素を生成
    let p_element = document.createElement('p');
    // p要素のタグ内テキストを設定
    p_element.innerHTML = '追加しました。';

    // 追加先の要素を取得
    let box_element = document.getElementById('box');
    // 取得した要素に生成したp要素を追加
    box_element.appendChild(p_element);

</script>
</body>
</html>
