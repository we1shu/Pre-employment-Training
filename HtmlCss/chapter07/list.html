<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ul と ol</title>
</head>
<body>
<h1>リスト</h1>
<h2>順序なしリスト（箇条書き）</h2>
<ul>
    <li>項目1</li>
    <li>項目2</li>
    <li>項目3</li>
</ul>
<h2>順序ありリスト</h2>
<ol>
    <li>1番目</li>
    <li>2番目</li>
    <li>3番目</li>
</ol>

<ul>
    <li>項目1</li>
    <p>ここにp要素を入れてはいけません</p>
    <li><a href="#">liの中はOKです。</a>項目2</li>
    <li>項目3</li>
</ul>
</body>
</html>
