<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ラベル</title>
</head>
<body>
<h1>ラベルの使い方</h1>
<form>
    <h2>テキストボックス</h2>
    <p>labelタグで囲む</p>
    <label>お名前<input type="text" name="your_name"></label>
    <h2>テキストボックスその2</h2>
    <p>labelのforとinputのidを一致させる</p>
    <label for="name_input">お名前</label>
    <input type="text" id="name_input" name="your_name">
    <h2>チェックボックス</h2>
    <label><input type="checkbox" name="mail" value="yes">お知らせを受け取る</label>
    <h2>ラジオボタン</h2>
    <label><input type="radio" name="gender" value="男性">男性</label>
    <label><input type="radio" name="gender" value="女性">女性</label>
    <h2>隠し(表示されません）</h2>
    <input type="hidden" name="user_id" value="5">
    <h2>送信ボタン</h2>
    <input type="submit" value="送信する">
</form>
</body>
</html>
