<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>フォーム</title>
</head>
<body>
<h1>フォームの使い方</h1>
<form>
    <h2>テキストボックス</h2>
    お名前: <input type="text" name="your_name">
    <h2>数値</h2>
    購入を希望する数量: <input type="number" name="amount">
    <h2>メールアドレス</h2>
    メールアドレス: <input type="email" name="your_email">
    <h2>チェックボックス</h2>
    <input type="checkbox" name="mail" value="yes">お知らせを受け取る
    <h2>ラジオボタン</h2>
    <input type="radio" name="gender" value="男性" checked>男性
    <input type="radio" name="gender" value="女性">女性
    <h2>隠し(表示されません）</h2>
    <input type="hidden" name="user_id" value="5">
    <h2>送信ボタン</h2>
    <input type="submit" value="送信する">
    <textarea name="user_id" rows="5" cols="30">初期値</textarea>

</form>
</body>
</html>
