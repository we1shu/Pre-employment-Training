<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CSSのサンプル</title>
    <style>
        h1 {
            color: red;
            font-size: large;
            background-color: lightblue;
        }
    </style>
</head>
<body>
<h1>Styleタグでも指定できます</h1>
<p>しかしこの方法では、「複数のページに共通するスタイル指定をページごとに記述する必要がある」「修正の際に変更箇所が多くなる」「HTML ファイルが巨大化する」というデメリットがあります。</p>
</body>
</html>
