<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>プラン一覧</title>
    <link rel="stylesheet" href="practice.css">
</head>
<body>

<h1 class="title">プラン一覧</h1>
<p class="subtitle">ブロンズ / シルバー / ゴールドからお選びください</p>

<div class="plan-container">

    <!-- ブロンズプラン -->
    <div class="price-card bronze">
        <div class="card-header">
            <h2>ブロンズプラン</h2>
        </div>
        <div class="card-body">
            <p class="price">¥1,000 / 月</p>
            <p>月1回のニュースレター, メールサポート</p>
        </div>
    </div>

    <!-- シルバープラン -->
    <div class="price-card silver">
        <div class="card-header">
            <h2>シルバープラン</h2>
        </div>
        <div class="card-body">
            <p class="price">¥3,000 / 月</p>
            <p>週1回のニュースレター, 優先メールサポート, 限定動画コンテンツ</p>
        </div>
    </div>

    <!-- ゴールドプラン -->
    <div class="price-card gold">
        <div class="card-header">
            <h2>ゴールドプラン</h2>
        </div>
        <div class="card-body">
            <p class="price">¥5,000 / 月</p>
            <p>3日に1回のニュースレター, 最優先メール & 電話サポート, 限定動画コンテンツ, 限定動画 & オンラインセミナー, イベント先行予約</p>
        </div>
    </div>

</div>
</body>
</html>
